name: Test the app

on:
  pull_request:
    paths: ["docs/app/**", "docs/deck/**", "anki/**", "test/**", ".github/workflows/app-test.yml"]
  push:
    branches: [main]
    paths: ["docs/app/**", "docs/deck/**", "anki/**", "test/**"]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          pip install -r test/requirements.txt -r test/python/requirements.txt
          playwright install --with-deps chromium
      # The quick ones first: they need no browser and they fail in a tenth of
      # a second, so a broken conversion is not waiting behind a browser
      # download to tell you.
      - name: The Python side
        run: python3 -m pytest test/python -q
      - name: The app in a browser
        run: python3 test/run.py
