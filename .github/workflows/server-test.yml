name: Test the Lexis server

on:
  pull_request:
    paths: ["server/**"]
  push:
    branches: [main]
    paths: ["server/**"]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - working-directory: server
        run: |
          npm install --no-audit --no-fund
          npm test
