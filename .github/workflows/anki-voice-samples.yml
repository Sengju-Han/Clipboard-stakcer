name: Anki voice samples

# Records the same three sentences in every voice worth considering, and opens
# a pull request adding them to the site. Merge it and open /voices.html on
# your phone: tap through them, pick one, and the page tells you exactly what
# to put in the TTS workflow.
#
# Touches no collection and needs no account. The sentences are fixed and
# neutral on purpose - the page is published, and study notes are not.

on:
  workflow_dispatch:
    inputs:
      voices:
        description: 'Comma-separated voice names. Leave empty for the usual dozen.'
        required: false
        default: ''

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: anki-voice-samples
  cancel-in-progress: false

jobs:
  record:
    name: Record and open a pull request
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: anki/requirements-tts.txt

      - name: Install
        run: pip install --disable-pip-version-check -r anki/requirements-tts.txt

      - name: Record
        env:
          # Passed as an environment variable, never interpolated into the shell.
          VOICES: ${{ inputs.voices }}
        run: |
          if [ -n "$VOICES" ]; then
            python anki/voice_samples.py --voices "$VOICES" --out-dir docs/voices
          else
            python anki/voice_samples.py --out-dir docs/voices
          fi

      - name: Open the pull request
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
          BASE: ${{ github.ref_name }}
        run: |
          if [ -z "$(git status --porcelain docs/voices)" ]; then
            echo "The samples are unchanged; nothing to open." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          BRANCH="voice-samples/run-$RUN_ID"
          git checkout -b "$BRANCH"
          git add docs/voices
          # printf rather than a heredoc: inside a YAML block scalar every line
          # is indented, and a heredoc terminator has to be flush left.
          printf '%s\n' \
            'The same three sentences in every voice.' \
            '' \
            'Merge this, then open `/voices.html` on your phone and tap through' \
            'them. The page tells you what to put in the **Anki TTS package**' \
            'workflow once you have chosen.' \
            '' \
            '---' \
            '_Generated by [Claude Code](https://claude.ai/code)_' > body.md
          git commit -m "Record the voice samples"
          git push -u origin "$BRANCH"
          gh pr create --base "$BASE" --head "$BRANCH" \
            --title "Voice samples" --body-file body.md
          {
            echo "Opened a pull request from \`$BRANCH\`."
            echo ""
            echo "Merge it, then open \`/voices.html\` on your phone."
          } >> "$GITHUB_STEP_SUMMARY"
