name: Test the app

on:
  pull_request:
    paths: ["docs/app/**", "docs/deck/**", "test/**", ".github/workflows/app-test.yml"]
  push:
    branches: [main]
    paths: ["docs/app/**", "docs/deck/**", "test/**"]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          pip install -r test/requirements.txt
          playwright install --with-deps chromium
      - name: Run
        run: python3 test/run.py
