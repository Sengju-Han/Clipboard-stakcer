name = "lexis"
main = "src/index.js"
compatibility_date = "2026-01-01"

# Created once with:  wrangler d1 create lexis
# then the id below is filled in. The deploy workflow does not create it: a
# database is the one thing that must not be made by accident twice.
[[d1_databases]]
binding = "DB"
database_name = "lexis"
database_id = "03227337-958f-4510-a92e-06b2d47a1ffb"

[vars]
# Where the app is served from. Anything else is refused at the CORS check, so
# a page on another domain cannot quietly use somebody's session.
ALLOWED_ORIGIN = "https://sengju-han.github.io"

# Puts the real reason into a 500 for *everybody*, signed in or not.
#
# Off. Somebody signed in is told the reason anyway - they own the account the
# error is about, and there is no log to read from a phone. This flag is only
# for the one case that cannot cover: a fault that stops anyone signing in, so
# there is nobody the reason could be told. Turn it on, find it, turn it off.
DEBUG_ERRORS = "0"
