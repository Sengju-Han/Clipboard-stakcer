name: Connect Google Drive

# Run once, in two goes. The first prints a link to approve; the second takes
# the code that link gives back and stores the lasting half of the connection
# as a secret. After that the export workflow puts its files straight into
# your Drive.
#
# The refresh token is never printed, here or anywhere. The code in between is
# single-use and worth nothing once spent, which is why that one is safe to
# read off a screen.

on:
  workflow_dispatch:
    inputs:
      code:
        description: 'Leave empty the first time. The second time, paste the code from the page Google sent you to.'
        required: false
        default: ''

# `secrets: write` is not a thing. There is no permission that lets the token a
# workflow is given write a repository secret - that needs a personal token,
# which is what REPO_ADMIN_TOKEN below is for. Asking for it here did not fail
# at the last step; it stopped the file parsing at all, so this workflow never
# appeared in the Actions list to be run.
permissions:
  contents: read

concurrency:
  group: google-connect
  cancel-in-progress: false

jobs:
  connect:
    name: Approve, then store
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install
        run: pip install --disable-pip-version-check pynacl

      - name: Connect
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          # A personal token with "Secrets: Read and write" on this repository.
          # The token Actions hands out cannot write secrets at all.
          GITHUB_TOKEN: ${{ secrets.REPO_ADMIN_TOKEN }}
          # Passed as an environment variable, never interpolated into the shell.
          CODE: ${{ inputs.code }}
        run: |
          python anki/google_connect.py \
            --code "$CODE" \
            --redirect "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/connected.html"
