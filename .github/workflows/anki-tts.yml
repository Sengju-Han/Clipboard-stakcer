name: Anki TTS package

# Generates neural audio for one field and packages it as an .apkg that updates
# your existing notes in place. Scheduling and review history are untouched:
# Anki matches notes on guid, so importing updates fields and leaves cards alone.
# Nothing is ever uploaded to your AnkiWeb account.

on:
  workflow_dispatch:
    inputs:
      deck:
        description: 'Deck name(s), comma-separated. Start with one small deck.'
        required: false
        default: 'Steve Jobs'
      field:
        description: 'Field to speak, and to append the [sound:] tag to'
        required: false
        default: 'Example'
      voice:
        description: 'Voice, e.g. en-US-AvaNeural, en-US-AndrewNeural, en-US-EmmaNeural'
        required: false
        default: 'en-US-AvaNeural'
      revoice:
        description: 'Re-record notes that already have audio, in the voice above. Recordings you made yourself are left alone.'
        required: false
        type: boolean
        default: false
      dry_run:
        description: 'Report what would be generated, generate nothing'
        required: false
        type: boolean
        default: false
      keep_tts:
        description: 'Leave {{tts}} in the templates (the card will then play both)'
        required: false
        type: boolean
        default: false
      limit:
        description: 'Only the first N notes (0 = all). Useful for a first look.'
        required: false
        default: '0'
      drive_folder:
        description: 'Folder in your Google Drive. Made if it is not there.'
        required: false
        default: 'Anki audio'
      confirm_public:
        description: 'Tick only if this repo is PUBLIC and you accept that the package is public too'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: anki-tts
  cancel-in-progress: false

jobs:
  build:
    name: Build the .apkg
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # At job level so the steps below can ask whether Drive is connected. A
    # secret cannot be tested directly in an `if`.
    env:
      GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}

    steps:
      - name: Check out the scripts
        uses: actions/checkout@v4

      - name: Refuse to publish study data from a public repository
        if: ${{ !github.event.repository.private && !inputs.confirm_public }}
        run: |
          echo "::error title=Public repository::This repository is public, so the package would be downloadable by anyone. Make the repository private (Settings -> General -> Change visibility), or re-run and tick 'confirm_public'."
          exit 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: anki/requirements-tts.txt

      - name: Install
        run: pip install --disable-pip-version-check -r anki/requirements-tts.txt

      # Audio filenames are a hash of the text and the voice, so a cached file is
      # always the right file. This is what makes a run that is cut short
      # resumable: the next one regenerates only what is missing.
      - name: Restore previously generated audio
        uses: actions/cache@v4
        with:
          path: tts-build/audio
          key: tts-audio-${{ inputs.voice }}-${{ inputs.field }}-${{ github.run_id }}
          restore-keys: |
            tts-audio-${{ inputs.voice }}-${{ inputs.field }}-

      - name: Build
        env:
          ANKIWEB_USERNAME: ${{ secrets.ANKIWEB_USERNAME }}
          ANKIWEB_PASSWORD: ${{ secrets.ANKIWEB_PASSWORD }}
          # Passed as environment variables, never interpolated into the shell.
          DECK: ${{ inputs.deck }}
          FIELD: ${{ inputs.field }}
          VOICE: ${{ inputs.voice }}
          LIMIT: ${{ inputs.limit }}
          DRY_RUN: ${{ inputs.dry_run }}
          KEEP_TTS: ${{ inputs.keep_tts }}
          REVOICE: ${{ inputs.revoice }}
        run: |
          FLAGS=""
          if [ "$DRY_RUN" = "true" ]; then FLAGS="$FLAGS --dry-run"; fi
          if [ "$KEEP_TTS" = "true" ]; then FLAGS="$FLAGS --keep-tts"; fi
          if [ "$REVOICE" = "true" ]; then FLAGS="$FLAGS --revoice"; fi
          python anki/build_tts_apkg.py \
            --deck "$DECK" \
            --field "$FIELD" \
            --voice "$VOICE" \
            --limit "${LIMIT:-0}" \
            --out-dir tts-build $FLAGS

      # Straight into Drive, where a phone can open it and hand it to Anki. The
      # artifact below stays as well: it costs nothing, and a run where Drive is
      # having a bad day should still leave the package somewhere.
      #
      # Named files rather than the folder, because tts-build also holds the
      # audio cache - some thousands of mp3 files that are a means, not a
      # result, and have no business in anybody's Drive.
      - name: Put it in Google Drive
        if: ${{ !inputs.dry_run && env.GOOGLE_REFRESH_TOKEN != '' }}
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          # Passed as an environment variable, never interpolated into the shell.
          FOLDER: ${{ inputs.drive_folder || 'Anki audio' }}
        run: |
          python anki/to_drive.py \
            --file tts-build/tts-update.apkg \
            --file tts-build/manifest.jsonl \
            --folder "$FOLDER" \
            --summary "$GITHUB_STEP_SUMMARY"

      - name: Say how to turn that on
        if: ${{ !inputs.dry_run && env.GOOGLE_REFRESH_TOKEN == '' }}
        run: |
          {
            echo "### The package is in the artifacts below"
            echo ""
            echo "Run **Connect Google Drive** once and it will go straight into your"
            echo "Drive instead. On a phone that is the difference between tapping the"
            echo "file and unzipping an artifact by hand."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the package
        if: ${{ !inputs.dry_run }}
        uses: actions/upload-artifact@v4
        with:
          name: anki-tts-package
          path: |
            tts-build/tts-update.apkg
            tts-build/manifest.jsonl
          if-no-files-found: error
          retention-days: 7
