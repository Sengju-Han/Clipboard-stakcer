name: Deploy the Lexis server

# Run by hand, or whenever the server changes on main. Setting it up is four
# steps on a phone and no terminal: server/README.md has them.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "server/**"
      - ".github/workflows/server-deploy.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check the secrets are there
        run: |
          missing=""
          [ -n "${{ secrets.CLOUDFLARE_API_TOKEN }}" ] || missing="$missing CLOUDFLARE_API_TOKEN"
          [ -n "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" ] || missing="$missing CLOUDFLARE_ACCOUNT_ID"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secret(s):$missing — see server/README.md, step 4."
            exit 1
          fi
          if grep -q REPLACE_WITH_YOUR_D1_DATABASE_ID server/wrangler.toml; then
            echo "::error::server/wrangler.toml still has the placeholder database id — see server/README.md, steps 1 and 2."
            exit 1
          fi

      - name: Test it before deploying it
        working-directory: server
        run: |
          npm install --no-audit --no-fund
          npm test

      # Every statement is CREATE TABLE IF NOT EXISTS, so this is safe to run
      # on every deploy and does nothing on the second one.
      - name: Make sure the tables exist
        working-directory: server
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 d1 execute lexis --remote --yes --file=schema.sql

      - name: Deploy
        working-directory: server
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy 2>&1 | tee deploy.log

      - name: Say where it is
        working-directory: server
        run: |
          url=$(grep -oE 'https://[a-zA-Z0-9.-]+\.workers\.dev' deploy.log | head -1)
          {
            echo "### The server is up"
            echo ""
            if [ -n "$url" ]; then
              echo "Address: \`$url\`"
              echo ""
              echo "Put that into the app under Settings → Account."
            else
              echo "Deployed. The address is in the log above."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
