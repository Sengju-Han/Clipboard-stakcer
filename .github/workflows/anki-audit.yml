name: Anki audit sentences

# Checks the sentences already in your collection and reports what is wrong.
# Read-only unless 'apply' is ticked. Cards made months ago carry the mistakes
# of the day they were typed, and a flashcard reviewed a hundred times teaches
# its mistake a hundred times.

on:
  workflow_dispatch:
    inputs:
      deck:
        description: 'Deck name(s), comma-separated. * = the whole collection.'
        required: false
        default: '*'
      field:
        description: 'Field to check'
        required: false
        default: 'Example'
      checker:
        description: 'claude (better, costs about a dollar for a thousand) or languagetool (free, slow)'
        required: false
        default: 'claude'
        type: choice
        options: [claude, languagetool]
      limit:
        description: 'Only the first N sentences (0 = all). Try 50 first.'
        required: false
        default: '50'
      apply:
        description: 'Write the corrections back and sync. Leave off to just look.'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

# Shares the write lock with the other workflows that sync.
concurrency:
  group: anki-write
  cancel-in-progress: false

jobs:
  audit:
    name: Check the collection
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: anki/requirements-tts.txt

      - name: Install
        run: pip install --disable-pip-version-check -r anki/requirements-tts.txt

      # Results are written as each batch lands, so a run that times out or is
      # cancelled can be resumed instead of paid for twice.
      - name: Restore an unfinished audit
        uses: actions/cache@v4
        with:
          path: audit
          key: anki-audit-${{ inputs.deck }}-${{ inputs.field }}-${{ github.run_id }}
          restore-keys: |
            anki-audit-${{ inputs.deck }}-${{ inputs.field }}-

      - name: Audit
        env:
          ANKIWEB_USERNAME: ${{ secrets.ANKIWEB_USERNAME }}
          ANKIWEB_PASSWORD: ${{ secrets.ANKIWEB_PASSWORD }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL }}
          # Passed as environment variables, never interpolated into the shell.
          DECK: ${{ inputs.deck }}
          FIELD: ${{ inputs.field }}
          CHECKER: ${{ inputs.checker }}
          LIMIT: ${{ inputs.limit }}
          APPLY: ${{ inputs.apply }}
        run: |
          FLAGS=""
          if [ "$APPLY" = "true" ]; then FLAGS="--apply"; fi
          python anki/audit.py \
            --deck "$DECK" \
            --field "$FIELD" \
            --checker "$CHECKER" \
            --limit "${LIMIT:-0}" \
            --out-dir audit $FLAGS

      - name: Upload the findings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit
          path: |
            audit/audit.jsonl
            audit/before-audit.colpkg
          if-no-files-found: ignore
          retention-days: 14
