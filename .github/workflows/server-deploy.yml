name: Deploy the Lexis server

# Run by hand, or whenever the server changes on main. Setting it up is four
# steps on a phone and no terminal: server/README.md has them.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "server/**"
      - ".github/workflows/server-deploy.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Not set up yet is not a failure. Until somebody has made a Cloudflare
      # account there is nothing to deploy to, and a red cross on every push
      # for a thing nobody has asked for yet is how people learn to ignore a
      # red cross. It says what is missing and stops.
      - name: Is there anywhere to deploy to?
        id: ready
        run: |
          missing=""
          [ -n "${{ secrets.CLOUDFLARE_API_TOKEN }}" ] || missing="$missing CLOUDFLARE_API_TOKEN"
          [ -n "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" ] || missing="$missing CLOUDFLARE_ACCOUNT_ID"
          grep -q REPLACE_WITH_YOUR_D1_DATABASE_ID server/wrangler.toml && missing="$missing the-database-id"
          if [ -n "$missing" ]; then
            echo "ready=no" >> "$GITHUB_OUTPUT"
            {
              echo "### The server is not set up yet"
              echo ""
              echo "Still to do:\`$missing\`"
              echo ""
              echo "Four steps, no terminal: see [server/README.md](../blob/main/server/README.md)."
              echo "Nothing was deployed, and nothing is broken — the app works without a server."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "ready=yes" >> "$GITHUB_OUTPUT"
          fi

      - name: Test it before deploying it
        if: steps.ready.outputs.ready == 'yes'
        working-directory: server
        run: |
          npm install --no-audit --no-fund
          npm test

      # Every statement is CREATE TABLE IF NOT EXISTS, so this is safe to run
      # on every deploy and does nothing on the second one.
      - name: Make sure the tables exist
        if: steps.ready.outputs.ready == 'yes'
        working-directory: server
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 d1 execute lexis --remote --yes --file=schema.sql

      - name: Deploy
        if: steps.ready.outputs.ready == 'yes'
        working-directory: server
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy 2>&1 | tee deploy.log

      # The app has no box for the address any more - there is one server and
      # asking which one every time was a question with a single answer. So
      # this checks the address it just deployed to against the one the app is
      # built with, and says something useful either way.
      - name: Say where it is, and whether the app agrees
        if: steps.ready.outputs.ready == 'yes'
        working-directory: server
        run: |
          url=$(grep -oE 'https://[a-zA-Z0-9.-]+\.workers\.dev' deploy.log | head -1)
          built=$(grep -oE 'https://[a-zA-Z0-9.-]+\.workers\.dev' ../docs/app/where.js | head -1)
          {
            echo "### The server is up"
            echo ""
            if [ -z "$url" ]; then
              echo "Deployed. The address is in the log above."
            elif [ "$url" = "$built" ]; then
              echo "Address: \`$url\` — which is the one the app is built with."
              echo ""
              echo "Nothing to do."
            else
              echo "::warning::The app points at a different server."
              echo "Deployed to: \`$url\`"
              echo ""
              echo "The app is built to talk to \`${built:-nothing}\`, so it is not"
              echo "talking to what was just deployed. Change \`DEFAULT\` in"
              echo "[docs/app/where.js](../blob/main/docs/app/where.js) to the address"
              echo "above. There is no box for it in the app on purpose."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
